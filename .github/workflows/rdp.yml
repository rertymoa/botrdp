name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Installer et connecter Tailscale
        shell: pwsh
        env:
          TS_KEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "ts.exe"
          Start-Process -FilePath ".\ts.exe" -ArgumentList "/quiet" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TS_KEY --unattended

      - name: Activer le Bureau a distance
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService

      - name: Definir le mot de passe
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $p = ConvertTo-SecureString $env:ADMIN_PASS -AsPlainText -Force
          Set-LocalUser -Name runneradmin -Password $p
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member runneradmin -ErrorAction SilentlyContinue

      - name: Afficher les infos de connexion
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "IP Tailscale :"
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "Utilisateur : runneradmin"
          Write-Host "=========================================="

      - name: Garder la session active
        shell: pwsh
        run: Start-Sleep -Seconds 20000
